version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: jammcare
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  api:
    build: ./api
    restart: on-failure
    env_file: ./api/.env
    ports:
      - "4000:4000"
    depends_on:
      - db

  web:
    build: ./web
    restart: on-failure
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db_data:
